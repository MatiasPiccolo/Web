<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Filtro por sector — interactivo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',sans-serif;background:#F3F2EF}
button{font-family:inherit;cursor:pointer;}
</style>
</helmet>
<div style="width: 1280px; height: 980px; box-sizing: border-box; background: #F3F2EF; padding: 56px 72px; display: flex; flex-direction: column; gap: 24px;">

  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <span style="background:#E91E79;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;padding:7px 18px;border-radius:999px;">PROVINCIA DE BUENOS AIRES</span>
    <h1 style="margin:0;font-family:'Poppins',sans-serif;font-weight:800;font-size:38px;color:#1A1A2E;text-align:center;">Propuesta 3 — Un sector a la vez</h1>
    <div style="width:64px;height:4px;background:#E91E79;border-radius:2px;"></div>
    <p style="margin:0;color:#6B6B76;font-size:15px;text-align:center;max-width:680px;">{{instructionText}}</p>
  </div>

  <div style="display:flex;justify-content:center;">
    <div style="display:flex;background:#FFFFFF;border:1.5px solid #E4E2DD;border-radius:999px;padding:5px;gap:4px;flex-wrap:wrap;max-width:1060px;justify-content:center;">
      <sc-for list="{{sectors}}" as="s" hint-placeholder-count="8">
        <button type="button" onClick="{{s.toggle}}" aria-pressed="{{s.active}}" style="{{s.chipStyle}}">{{s.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow:1;display:flex;gap:36px;">

    <div style="width:460px;flex-shrink:0;position:relative;">
      <div style="width:460px;height:480px;border-radius:20px;background:linear-gradient(135deg,#FBE3ED,#EDEBFB 55%,#DCEEF0);position:relative;overflow:hidden;">
        <span style="position:absolute;left:18px;top:18px;font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;color:#8C8C99;">MAPA (placeholder)</span>
        <sc-for list="{{regions}}" as="r" hint-placeholder-count="5">
          <div style="{{r.patchStyle}}"></div>
          <span style="{{r.labelStyle}}">{{r.num}}</span>
        </sc-for>
      </div>
      <p style="margin:14px 4px 0;font-size:12.5px;line-height:1.5;color:#8C8C99;">Las zonas se pintan en el color del sector elegido; el resto del mapa queda en gris neutro.</p>
    </div>

    <div style="flex-grow:1;display:flex;flex-direction:column;gap:18px;overflow-y:auto;">

      <p style="margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:#1A1A2E;">{{matchSummary}}</p>

      <sc-for list="{{regions}}" as="r" hint-placeholder-count="5">

        <sc-if value="{{r.matched}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{r.openInline}}" style="{{r.cardStyle}}">
            <span style="{{r.eyebrowStyle}}">REGIÓN {{r.num}}</span>
            <h3 style="margin:2px 0 12px;font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;color:#1A1A2E;text-align:left;">{{r.title}}</h3>
            <sc-for list="{{r.paragraphs}}" as="p" hint-placeholder-count="2">
              <p style="margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#3A3A44;text-align:left;"><strong>{{p.label}}:</strong> {{p.text}}</p>
            </sc-for>
          </button>
        </sc-if>

        <sc-if value="{{r.collapsed}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{r.openInline}}" style="{{r.rowStyle}}">
            <span style="{{r.rowTitleStyle}}">Región {{r.num}} — {{r.title}}</span>
            <span style="font-size:11.5px;color:#B4B4BC;">{{r.rowHint}}</span>
          </button>
        </sc-if>

      </sc-for>

    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":980}}'>
class Component extends DCLogic {

  renderVals() {
    const selected = this.state.selected ?? null;

    const sectorDefs = [
      { id: 0, label: 'Automotriz y Autopartes' },
      { id: 1, label: 'Petroquímica y Refinería' },
      { id: 2, label: 'Metalmecánica y Siderurgia' },
      { id: 3, label: 'Polos Tecnológicos e IT' },
      { id: 4, label: 'Agroindustria y Alimentos' },
      { id: 5, label: 'Textil e Indumentaria' },
      { id: 6, label: 'Turismo' },
      { id: 7, label: 'Naval y Pesquera' },
    ];

    const regionDefs = [
      {
        id: 1, num: '1', title: 'AMBA', sectorIds: [0, 1, 2, 3, 5],
        paragraphs: [
          { label: 'Norte', text: 'automotriz, autopartes, plásticos, polo tecnológico Constituyentes.' },
          { label: 'Sur', text: 'refinería Dock Sud, polo petroquímico La Plata, polo IT, metalmecánica y servicios al petróleo.' },
          { label: 'Interior', text: 'metalmecánica, calzado, marroquinería, textil, indumentaria, plásticos.' },
        ],
        patch: { left: 260, top: 20, w: 100, h: 80 },
      },
      {
        id: 2, num: '2', title: 'Centro Norte', sectorIds: [1, 2, 3, 4, 5],
        paragraphs: [
          { label: 'Corredor rutas 8 y 9', text: 'complejo siderúrgico, metalmecánica, refinería, polos tecnológicos Junín y Pergamino.' },
          { label: 'Corredor ruta 5', text: 'cadena maquinaria, agrícola, textil, confección.' },
        ],
        patch: { left: 30, top: 10, w: 200, h: 70 },
      },
      {
        id: 3, num: '3', title: 'Centro', sectorIds: [2, 3, 4],
        paragraphs: [
          { label: 'Zona centro serrana', text: 'cemento, metalurgia, chacinados, polo informático Tandil, cluster tecnológico Olavarría.' },
          { label: 'Centro oeste', text: 'lácteos, agroindustria, polos científico-tecnológicos Trenque Lauquen y Coronel Suárez.' },
        ],
        patch: { left: 60, top: 100, w: 220, h: 120 },
      },
      {
        id: 4, num: '4', title: 'Costa Atlántica', sectorIds: [3, 4, 5, 6, 7],
        paragraphs: [
          { label: 'La Costa', text: 'turismo, agroindustria.' },
          { label: 'Gran Mar del Plata', text: 'polo textil confeccionista, polo IT, industria naval e industria pesquera.' },
        ],
        patch: { left: 300, top: 130, w: 140, h: 230 },
      },
      {
        id: 5, num: '5', title: 'Sur', sectorIds: [1, 3],
        paragraphs: [
          { label: 'Gran Bahía Blanca', text: 'polo petroquímico, polo IT.' },
        ],
        patch: { left: 20, top: 250, w: 220, h: 170 },
      },
    ];

    const accent = '#14A6B8';
    const accentDark = '#0E7A87';

    const sectors = sectorDefs.map((s) => {
      const active = s.id === selected;
      return {
        ...s,
        active,
        chipStyle: `font-family:'Poppins',sans-serif;font-weight:${active ? 700 : 600};font-size:12.5px;padding:8px 15px;border-radius:999px;border:none;background:${active ? '#E91E79' : 'transparent'};color:${active ? '#FFFFFF' : '#7A7A84'};`,
        toggle: () => this.setState({ selected: active ? null : s.id, openId: null }),
      };
    });

    const matchedIds = selected === null
      ? []
      : regionDefs.filter((r) => r.sectorIds.includes(selected)).map((r) => r.id);

    const openId = this.state.openId ?? null;

    const ordered = [...regionDefs].sort((a, b) => {
      const am = matchedIds.includes(a.id) ? 0 : 1;
      const bm = matchedIds.includes(b.id) ? 0 : 1;
      return am - bm;
    });

    const regions = ordered.map((r) => {
      const isMatch = matchedIds.includes(r.id);
      const isOpen = isMatch || openId === r.id;
      return {
        ...r,
        matched: isOpen,
        collapsed: !isOpen,
        cardStyle: `all:unset;display:block;box-sizing:border-box;width:100%;text-align:left;background:#FFFFFF;border-radius:14px;border:1.5px solid ${isMatch ? '#E91E79' : '#E4E2DD'};padding:18px 20px;cursor:pointer;`,
        eyebrowStyle: `font-family:'Poppins',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.06em;color:${isMatch ? '#E91E79' : accentDark};`,
        rowStyle: `all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;background:#FFFFFF;border:1px solid #ECEAE4;border-radius:10px;padding:11px 18px;cursor:pointer;`,
        rowTitleStyle: `font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;color:${selected === null ? '#4A4A55' : '#B4B4BC'};`,
        rowHint: selected === null ? 'Tocá para previsualizar' : 'No tiene este sector',
        patchStyle: `position:absolute;left:${r.patch.left}px;top:${r.patch.top}px;width:${r.patch.w}px;height:${r.patch.h}px;border-radius:10px;border:3px solid #fff;background:${isMatch ? accent : '#D8D6D0'};opacity:${selected === null ? 0.55 : (isMatch ? 1 : 0.4)};transition:background .15s;`,
        labelStyle: `position:absolute;left:${r.patch.left + r.patch.w / 2 - 8}px;top:${r.patch.top + r.patch.h / 2 - 9}px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:#ffffff;pointer-events:none;`,
        openInline: () => this.setState({ openId: openId === r.id && !isMatch ? null : r.id }),
      };
    });

    const selectedSector = sectors.find((s) => s.active);
    const matchSummary = selected === null
      ? 'Ningún sector seleccionado — elegí uno arriba para filtrar las regiones.'
      : `${selectedSector.label} está presente en ${matchedIds.length} de 5 regiones:`;

    const instructionText = 'Hacé clic en un sector para que el mapa y la lista muestren solo las regiones donde existe. Volvé a hacer clic para deseleccionar.';

    return { sectors, regions, matchSummary, instructionText };
  }
}
</script>
</body>
</html>
